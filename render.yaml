services:
  - type: web
    name: av-suite-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    region: oregon
    plan: starter
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      # Set a fresh 32-byte hex secret generated with `openssl rand -hex 32`.
      - key: JWT_SECRET_KEY
        sync: false
      - key: PLATFORM_JWT_EXPIRE_MINUTES
        value: "480"
      # Set a fresh Fernet key generated with `Fernet.generate_key()`.
      - key: PLATFORM_MFA_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Set this to the exact comma-separated Control Center origin(s) before rollout.
      - key: CORS_ORIGINS
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
