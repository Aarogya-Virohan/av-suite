# Checks for every pull request and every push to dev.
#
# Frontend: every folder under frontend/ with a package.json is found
# automatically, so a new app (Tool 03, Tool 04) is checked from its first PR
# with no change here. Each app runs: npm ci, tsc, eslint (only when the app
# has an eslint.config.* file), its test script (when it has one), next build.
#
# Backend: pytest against a real Postgres 16, plus a check that Alembic has a
# single head and that every migration applies to an empty database. Tests
# listed in backend/tests/known_failures.txt are pre-existing failures on dev;
# they are skipped here so that a new failure stands out. Remove a line from
# that file when the test is fixed.
#
# Security audit: npm audit (production dependencies) per app and pip-audit
# for the backend. These report on every run but do not block a merge until
# the repository variable AUDIT_BLOCKING is set to "true"
# (Settings > Secrets and variables > Actions > Variables). Set it once the
# live apps are on fixed versions.

name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find-apps:
    name: Find frontend apps
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          apps=$(for f in frontend/*/package.json; do basename "$(dirname "$f")"; done | jq -R . | jq -cs .)
          echo "Apps: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (${{ matrix.app }})
    needs: find-apps
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.find-apps.outputs.apps) }}
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: |
          if ls eslint.config.* >/dev/null 2>&1; then
            npx eslint .
          else
            echo "::notice title=No ESLint config::frontend/${{ matrix.app }} has no eslint.config file, lint skipped."
          fi
      - name: Unit tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script in frontend/${{ matrix.app }}."
          fi
      - name: Build
        run: npx next build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avsuite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values: the tests need these set, never real secrets.
      JWT_SECRET_KEY: ci-only-not-a-secret
      SUPABASE_URL: http://localhost
      SUPABASE_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (same as backend/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-xlib-2.0-0 libffi-dev shared-mime-info fonts-liberation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Single Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/avsuite_test
        run: |
          heads=$(alembic heads | grep -c "(head)")
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected one Alembic head, found $heads."
            exit 1
          fi
      - name: Migrations apply to an empty database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migrations_check
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect("postgresql://postgres:postgres@localhost:5432/postgres")
              await conn.execute("CREATE DATABASE migrations_check")
              await conn.close()

          asyncio.run(main())
          PY
          alembic upgrade head
          alembic current
      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/avsuite_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/avsuite_test
        run: |
          deselect=()
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            deselect+=(--deselect "$line")
          done < tests/known_failures.txt
          echo "Skipping $(( ${#deselect[@]} / 2 )) known pre-existing failures (tests/known_failures.txt)."
          python -m pytest tests -q -p no:cacheprovider "${deselect[@]}"

  audit:
    name: Security audit
    needs: find-apps
    runs-on: ubuntu-24.04
    continue-on-error: ${{ vars.AUDIT_BLOCKING != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: npm audit (production dependencies)
        env:
          APPS: ${{ needs.find-apps.outputs.apps }}
        run: |
          failed=0
          for app in $(echo "$APPS" | jq -r '.[]'); do
            echo "::group::frontend/$app"
            if ! (cd "frontend/$app" && npm audit --omit=dev --package-lock-only --audit-level=high); then
              echo "::error title=npm audit::frontend/$app has high or critical advisories in production dependencies."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
      - name: pip-audit (backend)
        if: always()
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
