components:
  schemas:
    AnalyticsOverviewResponse:
      properties:
        patients:
          $ref: '#/components/schemas/PatientAnalytics'
        appointments:
          $ref: '#/components/schemas/AppointmentAnalytics'
        revenue:
          $ref: '#/components/schemas/RevenueAnalytics'
        leads:
          $ref: '#/components/schemas/LeadAnalytics'
        booking:
          $ref: '#/components/schemas/BookingAnalytics'
      type: object
      required:
      - patients
      - appointments
      - revenue
      - leads
      - booking
      title: AnalyticsOverviewResponse
      description: Aggregated dashboard overview response schema.
    AppointmentAnalytics:
      properties:
        today_appointments:
          type: integer
          title: Today Appointments
        this_week_appointments:
          type: integer
          title: This Week Appointments
        completed_appointments:
          type: integer
          title: Completed Appointments
        cancelled_appointments:
          type: integer
          title: Cancelled Appointments
        no_show_appointments:
          type: integer
          title: No Show Appointments
      type: object
      required:
      - today_appointments
      - this_week_appointments
      - completed_appointments
      - cancelled_appointments
      - no_show_appointments
      title: AppointmentAnalytics
      description: Analytics metrics for clinic appointments.
    AppointmentCreate:
      properties:
        patient_id:
          type: string
          format: uuid
          title: Patient Id
        therapist_id:
          type: string
          format: uuid
          title: Therapist Id
        scheduled_at:
          type: string
          format: date-time
          title: Scheduled At
        duration_minutes:
          type: integer
          exclusiveMinimum: 0.0
          title: Duration Minutes
          default: 30
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatus'
          default: scheduled
        source:
          allOf:
          - $ref: '#/components/schemas/AppointmentSource'
          default: manual
      type: object
      required:
      - patient_id
      - therapist_id
      - scheduled_at
      title: AppointmentCreate
      description: Payload for creating a new appointment.
    AppointmentListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AppointmentResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
