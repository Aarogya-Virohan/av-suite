  /api/v1/patients/{id}:
    get:
      tags:
      - Patients
      - Patients
      summary: Get Patient
      description: "Endpoint ka purpose: Specific patient ke details fetch karna\n\
        Yeh endpoint patient details retrieve karta hai by ID.\n\nHTTP Method: GET\n\
        URL: /api/v1/patients/{id}\nStatus Code: 200 OK (found)\n\nPath Parameters:\n\
        - id (str): Patient UUID\n\nRequest Headers:\nAuthorization: Bearer {jwt_token}\n\
        \nResponse (ResponseEnvelope[PatientRead]):\n{\n    \"status\": \"success\"\
        ,\n    \"data\": {\n        \"id\": \"patient-uuid\",\n        \"clinic_id\"\
        : \"clinic-uuid\",\n        \"first_name\": \"John\",\n        \"last_name\"\
        : \"Doe\",\n        \"date_of_birth\": \"1990-01-01\",\n        \"phone\"\
        : \"9876543210\",\n        \"created_at\": \"2024-01-01T00:00:00Z\",\n   \
        \     \"updated_at\": \"2024-01-01T00:00:00Z\"\n    }\n}\n\nError Responses:\n\
        - 401 UNAUTHORIZED: Missing or invalid JWT token\n- 403 FORBIDDEN: User role\
        \ not authorized\n- 404 NOT_FOUND: Patient not found or not in user's clinic\n\
        - 400 BAD REQUEST: Invalid patient ID format\n- 500 INTERNAL_SERVER_ERROR:\
        \ Database error\n\nSecurity:\n- JWT token required: All requests authenticated\n\
        - Clinic isolation: Patient sirf user ke clinic mein\n- Role check: Only admin/physio\
        \ access kar sakte hain\n- Cross-clinic prevention: Can't access other clinic's\
        \ patients\n\nBusiness Logic:\n1. Authorization check - physio ya admin\n\
        2. Patient fetch by ID aur clinic check\n3. Patient found = return data, Not\
        \ found = 404\n\nUsage Example:\ncurl -X GET http://localhost:8000/api/v1/patients/12345678-1234-5678-1234-567812345678\
        \ \\\n  -H \"Authorization: Bearer eyJhbGc...\""
      operationId: get_patient_api_v1_patients__id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope_PatientRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Patients
      - Patients
      summary: Update Patient
      operationId: update_patient_api_v1_patients__id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
